<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PulseMon - Monitor</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --line: #2a3140;
        --text: #d8deea;
        --muted: #90a0bc;
        --ok: #2ec27e;
        --bad: #e01b24;
        --cpu: #62a0ea;
        --gpu: #f66151;
        --temp: #ffb84d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #1c2130 0%, var(--bg) 45%);
        color: var(--text);
      }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 20px; }
      .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
      h1 { margin: 0; font-size: 20px; font-weight: 600; }
      .meta, .status { color: var(--muted); font-size: 13px; }
      .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
      .tab-btn {
        border: 1px solid var(--line);
        background: #111826;
        color: var(--text);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .tab-btn.active { border-color: #4b86d8; color: #b9d5ff; }
      .tab { display: none; }
      .tab.active { display: block; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 12px; }
      .charts { margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(280px, 1fr)); gap: 12px; }
      .panel {
        background: color-mix(in oklab, var(--panel) 92%, black);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
      }
      .label { color: var(--muted); font-size: 12px; }
      .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
      .row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; }
      canvas {
        width: 100%;
        height: 160px;
        display: block;
        border-radius: 8px;
        background: #0f131d;
        border: 1px solid #232a38;
      }
      .legend { margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
      .status { margin-top: 12px; }
      @media (max-width: 860px) {
        .grid, .charts { grid-template-columns: 1fr; }
        .top { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <h1>Stats Linux Monitor (V1)</h1>
        <div class="meta" id="host-meta">host: -</div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-btn-main" type="button">General</button>
        <button class="tab-btn" id="tab-btn-gpu" type="button">GPU AMD</button>
      </div>

      <section class="tab active" id="tab-main">
        <div class="grid">
          <div class="panel">
            <div class="label">CPU usage</div>
            <div class="value" id="cpu-pct">-</div>
            <div class="row"><span>Temp</span><span id="cpu-temp">-</span></div>
          </div>
          <div class="panel">
            <div class="label">Memory</div>
            <div class="value" id="mem-pct">-</div>
            <div class="row"><span>Used</span><span id="mem-used">-</span></div>
            <div class="row"><span>Total</span><span id="mem-total">-</span></div>
          </div>
          <div class="panel">
            <div class="label">GPU usage</div>
            <div class="value" id="gpu-pct">-</div>
            <div class="row"><span>Temp</span><span id="gpu-temp">-</span></div>
            <div class="row"><span>Power</span><span id="gpu-power">-</span></div>
          </div>
        </div>

        <div class="charts">
          <div class="panel">
            <div class="label">History CPU/GPU %</div>
            <canvas id="usage-chart" width="500" height="160"></canvas>
            <div class="legend">
              <span><span class="dot" style="background: var(--cpu)"></span>CPU %</span>
              <span><span class="dot" style="background: var(--gpu)"></span>GPU %</span>
            </div>
          </div>
          <div class="panel">
            <div class="label">History CPU/GPU temperature</div>
            <canvas id="temp-chart" width="500" height="160"></canvas>
            <div class="legend">
              <span><span class="dot" style="background: var(--temp)"></span>CPU °C</span>
              <span><span class="dot" style="background: var(--gpu)"></span>GPU °C</span>
            </div>
          </div>
        </div>
      </section>

      <section class="tab" id="tab-gpu">
        <div class="grid">
          <div class="panel">
            <div class="label">GPU usage</div>
            <div class="value" id="gpu2-pct">-</div>
            <div class="row"><span>Core clock</span><span id="gpu2-core">-</span></div>
            <div class="row"><span>VRAM clock</span><span id="gpu2-memclock">-</span></div>
          </div>
          <div class="panel">
            <div class="label">VRAM</div>
            <div class="value" id="gpu2-vram-pct">-</div>
            <div class="row"><span>Used</span><span id="gpu2-vram-used">-</span></div>
            <div class="row"><span>Total</span><span id="gpu2-vram-total">-</span></div>
          </div>
          <div class="panel">
            <div class="label">Thermals & GPU fan</div>
            <div class="value" id="gpu2-temp">-</div>
            <div class="row"><span>Power</span><span id="gpu2-power">-</span></div>
            <div class="row"><span>GPU fan</span><span id="gpu2-fan">-</span></div>
          </div>
        </div>
      </section>

      <div class="status" id="status-line">chargement...</div>
    </div>

    <script>
      const API = "/api/v1";
      const HISTORY_WINDOW_S = 10;
      const HISTORY_STEP_S = 1;
      const HISTORY_MODE = "display";
      const HISTORY_RESYNC_MS = 30000;
      const DASHBOARD_POLL_MS = 1000;
      const HISTORY_POLL_MS = 1000;

      const el = {
        hostMeta: document.getElementById("host-meta"),
        cpuPct: document.getElementById("cpu-pct"),
        cpuTemp: document.getElementById("cpu-temp"),
        memPct: document.getElementById("mem-pct"),
        memUsed: document.getElementById("mem-used"),
        memTotal: document.getElementById("mem-total"),
        gpuPct: document.getElementById("gpu-pct"),
        gpuTemp: document.getElementById("gpu-temp"),
        gpuPower: document.getElementById("gpu-power"),
        gpu2Pct: document.getElementById("gpu2-pct"),
        gpu2Core: document.getElementById("gpu2-core"),
        gpu2MemClock: document.getElementById("gpu2-memclock"),
        gpu2VramPct: document.getElementById("gpu2-vram-pct"),
        gpu2VramUsed: document.getElementById("gpu2-vram-used"),
        gpu2VramTotal: document.getElementById("gpu2-vram-total"),
        gpu2Temp: document.getElementById("gpu2-temp"),
        gpu2Power: document.getElementById("gpu2-power"),
        gpu2Fan: document.getElementById("gpu2-fan"),
        usageChart: document.getElementById("usage-chart"),
        tempChart: document.getElementById("temp-chart"),
        status: document.getElementById("status-line"),
        tabBtnMain: document.getElementById("tab-btn-main"),
        tabBtnGpu: document.getElementById("tab-btn-gpu"),
        tabMain: document.getElementById("tab-main"),
        tabGpu: document.getElementById("tab-gpu"),
      };

      const historyState = {
        ts_ms: [],
        cpu_pct: [],
        cpu_temp_c: [],
        gpu_pct: [],
        gpu_temp_c: [],
        lastResyncAtMs: 0,
      };

      let dashboardInFlight = false;
      let gpuDashboardInFlight = false;
      let historyInFlight = false;
      let lastDashboardTs = null;
      let lastHistoryTs = null;

      function metricDisplay(metric, suffix = "") {
        if (!metric || metric.valid !== true || metric.value_display === null || metric.value_display === undefined) {
          return "-";
        }
        return `${metric.value_display}${suffix}`;
      }

      function bytesDisplay(metric) {
        if (!metric || metric.valid !== true || metric.value_display === null || metric.value_display === undefined) {
          return "-";
        }
        const value = Number(metric.value_display);
        if (!Number.isFinite(value)) return "-";
        const gib = value / (1024 ** 3);
        return `${gib.toFixed(2)} GiB`;
      }

      function setTab(name) {
        const main = name === "main";
        el.tabMain.classList.toggle("active", main);
        el.tabGpu.classList.toggle("active", !main);
        el.tabBtnMain.classList.toggle("active", main);
        el.tabBtnGpu.classList.toggle("active", !main);
      }

      function buildHistoryUrl(forceFull) {
        const params = new URLSearchParams({
          window: String(HISTORY_WINDOW_S),
          step: String(HISTORY_STEP_S),
          mode: HISTORY_MODE,
        });
        const lastTs = historyState.ts_ms.at(-1);
        if (!forceFull && Number.isFinite(lastTs)) {
          params.set("since_ts_ms", String(lastTs));
        }
        return `${API}/history?${params.toString()}`;
      }

      function normalizeHistory(historyPayload) {
        const ts = Array.isArray(historyPayload?.ts_ms) ? historyPayload.ts_ms : [];
        const series = historyPayload?.series || {};
        const fields = ["cpu_pct", "cpu_temp_c", "gpu_pct", "gpu_temp_c"];
        const out = { ts_ms: ts };
        for (const field of fields) {
          const values = Array.isArray(series[field]) ? series[field] : [];
          out[field] = ts.map((_, index) => values[index] ?? null);
        }
        return out;
      }

      function replaceHistoryState(payload) {
        const normalized = normalizeHistory(payload);
        Object.assign(historyState, normalized);
        historyState.lastResyncAtMs = Date.now();
      }

      function appendHistoryDelta(payload) {
        const normalized = normalizeHistory(payload);
        let appended = 0;
        const currentLast = historyState.ts_ms.at(-1) ?? -1;
        for (let i = 0; i < normalized.ts_ms.length; i += 1) {
          const ts = normalized.ts_ms[i];
          if (!Number.isFinite(ts) || ts <= currentLast) continue;
          historyState.ts_ms.push(ts);
          historyState.cpu_pct.push(normalized.cpu_pct[i]);
          historyState.cpu_temp_c.push(normalized.cpu_temp_c[i]);
          historyState.gpu_pct.push(normalized.gpu_pct[i]);
          historyState.gpu_temp_c.push(normalized.gpu_temp_c[i]);
          appended += 1;
        }
        const maxPoints = Math.max(2, Math.ceil(HISTORY_WINDOW_S / HISTORY_STEP_S) + 2);
        for (const field of ["ts_ms", "cpu_pct", "cpu_temp_c", "gpu_pct", "gpu_temp_c"]) {
          if (historyState[field].length > maxPoints) {
            historyState[field].splice(0, historyState[field].length - maxPoints);
          }
        }
        return appended;
      }

      function drawChart(canvas, series, minValue, maxValue) {
        const ctx = canvas.getContext("2d");
        const width = canvas.width;
        const height = canvas.height;
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = "#253047";
        ctx.lineWidth = 1;
        for (let i = 1; i < 4; i += 1) {
          const y = (height * i) / 4;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
        const count = Math.max(2, ...series.map((item) => item.values.length));
        for (const item of series) {
          ctx.strokeStyle = item.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          let started = false;
          item.values.forEach((value, index) => {
            if (value === null || value === undefined || !Number.isFinite(Number(value))) {
              started = false;
              return;
            }
            const ratio = Math.max(0, Math.min(1, (Number(value) - minValue) / (maxValue - minValue)));
            const x = (index / (count - 1)) * width;
            const y = height - ratio * height;
            if (!started) {
              ctx.moveTo(x, y);
              started = true;
            } else {
              ctx.lineTo(x, y);
            }
          });
          ctx.stroke();
        }
      }

      function drawHistoryCharts() {
        drawChart(el.usageChart, [
          { values: historyState.cpu_pct, color: "#62a0ea" },
          { values: historyState.gpu_pct, color: "#f66151" },
        ], 0, 100);
        drawChart(el.tempChart, [
          { values: historyState.cpu_temp_c, color: "#ffb84d" },
          { values: historyState.gpu_temp_c, color: "#f66151" },
        ], 0, 110);
      }

      async function fetchDashboard() {
        const r = await fetch(`${API}/dashboard`, { cache: "no-store" });
        if (!r.ok) throw new Error(`dashboard ${r.status}`);
        const d = await r.json();
        lastDashboardTs = d.ts;
        el.hostMeta.textContent = `host: ${d.host || "-"}`;
        el.cpuPct.textContent = metricDisplay(d.cpu?.pct, "%");
        el.cpuTemp.textContent = metricDisplay(d.cpu?.temp_c, " °C");
        el.memPct.textContent = metricDisplay(d.mem?.pct, "%");
        el.memUsed.textContent = bytesDisplay(d.mem?.used_b);
        el.memTotal.textContent = bytesDisplay(d.mem?.total_b);
        el.gpuPct.textContent = metricDisplay(d.gpu?.pct, "%");
        el.gpuTemp.textContent = metricDisplay(d.gpu?.temp_c, " °C");
        el.gpuPower.textContent = metricDisplay(d.gpu?.power_w, " W");
      }

      async function fetchGpuDashboard() {
        const r = await fetch(`${API}/gpu/dashboard`, { cache: "no-store" });
        if (!r.ok) throw new Error(`gpu_dashboard ${r.status}`);
        const d = await r.json();
        const gpu = d.gpu || {};
        el.gpu2Pct.textContent = metricDisplay(gpu.pct, "%");
        el.gpu2Core.textContent = metricDisplay(gpu.core_clock_mhz, " MHz");
        el.gpu2MemClock.textContent = metricDisplay(gpu.mem_clock_mhz, " MHz");
        el.gpu2VramPct.textContent = metricDisplay(gpu.vram_pct, "%");
        el.gpu2VramUsed.textContent = bytesDisplay(gpu.vram_used_b);
        el.gpu2VramTotal.textContent = bytesDisplay(gpu.vram_total_b);
        el.gpu2Temp.textContent = metricDisplay(gpu.temp_c, " °C");
        el.gpu2Power.textContent = metricDisplay(gpu.power_w, " W");
        const rpm = metricDisplay(gpu.fan_rpm, " RPM");
        const pct = metricDisplay(gpu.fan_pct, "%");
        el.gpu2Fan.textContent = rpm === "-" && pct === "-" ? "-" : `${rpm} / ${pct}`;
      }

      async function fetchHistory() {
        const periodicResync = historyState.lastResyncAtMs === 0 || Date.now() - historyState.lastResyncAtMs >= HISTORY_RESYNC_MS;
        const forceFull = historyState.ts_ms.length === 0 || periodicResync;
        const r = await fetch(buildHistoryUrl(forceFull), { cache: "no-store" });
        if (!r.ok) throw new Error(`history ${r.status}`);
        const payload = await r.json();
        lastHistoryTs = payload.ts;
        if (forceFull) {
          replaceHistoryState(payload);
          drawHistoryCharts();
          return;
        }
        if (appendHistoryDelta(payload) > 0) drawHistoryCharts();
      }

      async function tickDashboard() {
        if (dashboardInFlight) return;
        dashboardInFlight = true;
        try {
          await fetchDashboard();
          el.status.textContent = `dashboard ts=${lastDashboardTs ?? "-"}`;
        } catch (error) {
          el.status.textContent = `dashboard error: ${error.message}`;
        } finally {
          dashboardInFlight = false;
        }
      }

      async function tickGpuDashboard() {
        if (gpuDashboardInFlight) return;
        gpuDashboardInFlight = true;
        try {
          await fetchGpuDashboard();
        } catch (error) {
          el.status.textContent += ` | gpu error: ${error.message}`;
        } finally {
          gpuDashboardInFlight = false;
        }
      }

      async function tickHistory() {
        if (historyInFlight) return;
        historyInFlight = true;
        try {
          await fetchHistory();
          el.status.textContent += ` | history ts=${lastHistoryTs ?? "-"}`;
        } catch (error) {
          el.status.textContent += ` | history error: ${error.message}`;
        } finally {
          historyInFlight = false;
        }
      }

      el.tabBtnMain.addEventListener("click", () => setTab("main"));
      el.tabBtnGpu.addEventListener("click", () => setTab("gpu"));
      setTab("main");
      tickDashboard();
      tickGpuDashboard();
      tickHistory();
      setInterval(tickDashboard, DASHBOARD_POLL_MS);
      setInterval(tickGpuDashboard, DASHBOARD_POLL_MS);
      setInterval(tickHistory, HISTORY_POLL_MS);
    </script>
  </body>
</html>
