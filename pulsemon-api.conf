# PulseMon API runtime configuration (EnvironmentFile for systemd)
# Invalid values stop the service before Uvicorn starts.

STATS_BIND_HOST=0.0.0.0
STATS_BIND_PORT=8000

# Sampling and in-memory history
# STATS_SAMPLE_INTERVAL_S: 0.01 .. 60.0
# STATS_PUBLISH_INTERVAL_S: 0.01 .. 3600.0
# STATS_HISTORY_CAPACITY: 1 .. 1000000
# STATS_DISPLAY_EMA_ALPHA: > 0.0 and <= 1.0
STATS_SAMPLE_INTERVAL_S=0.1
STATS_PUBLISH_INTERVAL_S=0.5
STATS_HISTORY_CAPACITY=600
STATS_DISPLAY_EMA_ALPHA=0.25

# CRITICAL, ERROR, WARNING, INFO or DEBUG
STATS_LOG_LEVEL=INFO

# Optional API key protection
# STATS_API_KEY=
# STATS_API_KEY_HEADER=X-API-Key

# Optional GPU selection
# PCI BDF: dddd:bb:ss.f or bb:ss.f
# STATS_GPU_PCI_SLOT=0000:0a:00.0
# Comma-separated, unique lowercase-compatible labels; unknown is appended if absent.
# STATS_GPU_TEMP_LABEL_PRIORITY=edge,junction,mem,unknown

# Optional diagnostics
# Boolean values: 1/0, true/false, yes/no or on/off
# Capture frequencies: 0.1 .. 1000.0 Hz
# Capture durations: 1 .. 86400 seconds
# STATS_DIAGNOSTICS=0
# STATS_DIAG_RAW_CAPTURE=0
# STATS_DIAG_RAW_HZ=8.0
# STATS_DIAG_RAW_DURATION_S=60
# STATS_DIAG_RAW_LOG_PATH=/var/lib/pulsemon-api/raw_metrics.jsonl
# STATS_DIAG_COMPARE_CAPTURE=0
# STATS_DIAG_COMPARE_HZ=10.0
# STATS_DIAG_COMPARE_DURATION_S=60
# STATS_DIAG_COMPARE_LOG_PATH=/var/lib/pulsemon-api/raw_vs_display_gpu_pct.jsonl
